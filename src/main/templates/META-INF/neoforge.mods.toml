modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="venatorvictor"
description='''A seasons mod where the whole world follows the year, in one mod with no library dependencies.

- Four seasons, each with an early, mid and late part; the year length is up to you.
- A real climate in °C: each climate zone has its own seasons (mild coasts, cold north, tundra, deserts, tropical wet and dry seasons), warmer days and colder nights, random warm and cold spells, and the warmest weeks coming after midsummer as in real life.
- Neighbouring biomes blend their climates, and winter fades out near jungles and deserts.
- Day length changes with the season: long summer days, short winter days.
- Snow falls and builds up while it's cold and melts in a thaw; it settles in grass, flowers and plants and on fences, and slides in and out instead of popping. Lakes and rivers freeze.
- Crops grow by temperature: fast in their ideal range, slowly when it's cool or warm, dormant in the cold, and killed by frost or heat. Campfires, torches and other heat sources protect them; ice cools them. On hot days farmland needs water closer by.
- Grass and leaves change color through the year, birches turn yellow and orange in autumn, and flowers bud, bloom and go to seed.
- Distant Horizons: far terrain follows the colors and the snow.
- A temperature API for other mods, and a config screen with tabs, descriptions and the performance cost of each setting.'''

[[mixins]]
    config="${mod_id}.mixins.json"

# Distant Horizons and snow mod hooks; skipped when those mods aren't installed.
[[mixins]]
    config="${mod_id}.compat.mixins.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Same job: both would change the same things.
[[dependencies.${mod_id}]]
    modId="sereneseasons"
    type="incompatible"
    reason="Equinox replaces this seasons mod. Remove it."
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="eclipticseasons"
    type="incompatible"
    reason="Equinox replaces this seasons mod. Remove it."
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Built against 3.3.3; LOD colors and snow use DH internals, so other versions may log a warning and skip them.
[[dependencies.${mod_id}]]
    modId="distanthorizons"
    type="optional"
    versionRange="[3.3.3,)"
    ordering="AFTER"
    side="CLIENT"

# Built against 12.2.3; the snow cover uses its API to make plants snowy.
[[dependencies.${mod_id}]]
    modId="snowrealmagic"
    type="optional"
    versionRange="[12.2.3,)"
    ordering="NONE"
    side="BOTH"

# Same job as our snow cover; both running would fight over the same blocks.
[[dependencies.${mod_id}]]
    modId="immersive_snow_reloaded"
    type="incompatible"
    reason="Equinox already has a snow cover. Remove this mod."
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
