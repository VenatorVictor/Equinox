modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="venatorvictor"
description='''§fThe whole world follows the year: §aSpring§f, §eSummer§f, §6Autumn§f and §bWinter§f.

§6§lClimate
§7• Each biome has its own seasons: mild coasts, a cold north, deserts, rainy and dry tropics.
§7• Neighbouring biomes blend, and winter fades out near jungles and deserts.
§7• Long summer days, short winter days.

§b§lSnow
§7• Snow builds up while it's cold and melts in a thaw.
§7• It settles in grass, flowers and plants and on fences, and slides in and out instead of popping.
§7• Lakes and rivers freeze.

§a§lCrops
§7• Crops grow by temperature: fast when it's ideal, slowly when it's cool or warm, dormant in the cold, killed by frost or heat.
§7• Campfires, torches and other heat sources protect them; ice cools them.
§7• On hot days farmland needs water closer by.

§d§lColors
§7• Grass and leaves change color through the year; birches turn yellow and orange in autumn.
§7• Flowers bud, bloom and go to seed.

§9§lMore
§7• Distant Horizons: far terrain follows the colors and the snow.
§7• A config screen with tabs, descriptions and the performance cost of each setting.
§7• No library mods needed; a temperature API for other mods.'''

[[mixins]]
    config="${mod_id}.mixins.json"

# Distant Horizons and snow mod hooks; skipped when those mods aren't installed.
[[mixins]]
    config="${mod_id}.compat.mixins.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Same job: both would change the same things.
[[dependencies.${mod_id}]]
    modId="sereneseasons"
    type="incompatible"
    reason="Equinox replaces this seasons mod. Remove it."
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="eclipticseasons"
    type="incompatible"
    reason="Equinox replaces this seasons mod. Remove it."
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Built against 3.3.3; LOD colors and snow use DH internals, so other versions may log a warning and skip them.
[[dependencies.${mod_id}]]
    modId="distanthorizons"
    type="optional"
    versionRange="[3.3.3,)"
    ordering="AFTER"
    side="CLIENT"

# Built against 12.2.3; the snow cover uses its API to make plants snowy.
[[dependencies.${mod_id}]]
    modId="snowrealmagic"
    type="optional"
    versionRange="[12.2.3,)"
    ordering="NONE"
    side="BOTH"

# Same job as our snow cover; both running would fight over the same blocks.
[[dependencies.${mod_id}]]
    modId="immersive_snow_reloaded"
    type="incompatible"
    reason="Equinox already has a snow cover. Remove this mod."
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
