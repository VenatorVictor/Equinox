plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Optional mods we hook into, compile time only.
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.su5ed.dev/releases" } }
        filter { includeGroup "org.sinytra.forgified-fabric-api" }
    }
}

dependencies {
    // All optional: their classes are only touched from code that runs when they're installed.
    // Distant Horizons 3.3.3 (LOD colors and snow; uses its internals).
    compileOnly("maven.modrinth:uCdwusMi:9w34y8ai") { transitive = false }
    // Snow! Real Magic 12.2.3 and its library Kiwi 15.8.7 (snowy plants).
    compileOnly("maven.modrinth:iJNje1E8:XXjs6tNa") { transitive = false }
    compileOnly("maven.modrinth:ufdDoWPd:tfwJWC8g") { transitive = false }
    // Forgified Fabric Renderer API, bundled in Snow! Real Magic (its renderer hook works on Fabric quads).
    compileOnly("org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:3.4.0+9c40919e19") { transitive = false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
